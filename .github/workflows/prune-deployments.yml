name: Prune old deployments

on:
  workflow_dispatch:
    inputs:
      keepRuns:
        description: Keep newest workflow runs
        required: false
        default: "20"
      keepArtifacts:
        description: Keep newest artifacts
        required: false
        default: "20"
      keepDeployments:
        description: Keep newest deployments
        required: false
        default: "15"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: write
  contents: read
  deployments: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run prune script
        shell: pwsh
        run: |
          $keepRuns = "${{ github.event.inputs.keepRuns }}"
          $keepArtifacts = "${{ github.event.inputs.keepArtifacts }}"
          $keepDeployments = "${{ github.event.inputs.keepDeployments }}"

          if ([string]::IsNullOrWhiteSpace($keepRuns)) { $keepRuns = "20" }
          if ([string]::IsNullOrWhiteSpace($keepArtifacts)) { $keepArtifacts = "20" }
          if ([string]::IsNullOrWhiteSpace($keepDeployments)) { $keepDeployments = "15" }

          ./scripts/prune-old-deployments.ps1 `
            -Repo "${{ github.repository }}" `
            -KeepRuns ([int]$keepRuns) `
            -KeepArtifacts ([int]$keepArtifacts) `
            -KeepDeployments ([int]$keepDeployments)

        env:
          GH_TOKEN: ${{ github.token }}
