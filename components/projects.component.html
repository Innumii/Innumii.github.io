<section class="section reveal" id="projects">

    <div class="project-grid" id="projects-list">
      <!-- Project items will be loaded here from data/projects.json -->

  </div>
</section>

      <div class="tags"></div>
      <p class="project-year"></p>
    </article>

</template>
